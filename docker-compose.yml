# Local testing for jampuk docs -> http://localhost:8088
# Usage:
#   docker compose up --build        # build + serve
#   docker compose up --build -d     # detached
#   docker compose down
services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the Astro build; override per environment as needed.
        - PUBLIC_DOCS_SITE=${PUBLIC_DOCS_SITE:-http://localhost:8088}
    ports:
      - "8088:8088"
    restart: unless-stopped
